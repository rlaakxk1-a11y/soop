name: Android APK
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: soop-viewer-debug-signing-v1
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint
        run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: soop-viewer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: app/build/reports/
  publish-apk:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: soop-viewer-apk
          path: apk
      - name: Publish directly installable APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APK_RUN_NUMBER: ${{ github.run_number }}
        run: |
          apk_tag="preview-0.5.0-${APK_RUN_NUMBER}"
          mv apk/app-debug.apk apk/soop-viewer-0.5.0.apk
          sha256sum apk/soop-viewer-0.5.0.apk > apk/SHA256SUMS.txt
          gh release create "$apk_tag" apk/soop-viewer-0.5.0.apk apk/SHA256SUMS.txt --target "$APK_HEAD_SHA" --prerelease --title "SOOP Viewer 0.5.0 preview ${APK_RUN_NUMBER}" --notes "Install the .apk directly. PiP support, playback tests and APK signature verified. Real-device behavior depends on Android settings and SOOP account/broadcast availability."
          gh release view "$apk_tag" --json assets --jq '.assets[] | select(.name | endswith(".apk")) | .url'
