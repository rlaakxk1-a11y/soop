plugins { id 'com.android.application' }
android {
 namespace 'dev.soopviewer'
 compileSdk 35
 defaultConfig { applicationId 'dev.soopviewer'; minSdk 26; targetSdk 35; versionCode 2; versionName '0.2.0' }
 testOptions { unitTests.includeAndroidResources = true; unitTests.all { testLogging { exceptionFormat 'full' } } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.appcompat:appcompat:1.7.0'
 implementation 'androidx.recyclerview:recyclerview:1.3.2'
 implementation 'androidx.media3:media3-exoplayer:1.5.1'
 implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
 implementation 'androidx.media3:media3-ui:1.5.1'
 implementation 'androidx.media3:media3-datasource-okhttp:1.5.1'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'com.github.bumptech.glide:glide:4.16.0'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}
